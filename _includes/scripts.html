<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

{% include comments-providers/scripts.html %}

<script>
(function() {
  const sections = document.querySelectorAll('section[id]');
  const navLinks = document.querySelectorAll('.visible-links a[href^="#"]');
  if (!sections.length || !navLinks.length) return;
  const observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        navLinks.forEach(function(a) { a.parentElement.classList.remove('selected'); });
        const active = document.querySelector('.visible-links a[href="#' + entry.target.id + '"]');
        if (active) active.parentElement.classList.add('selected');
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });
  sections.forEach(function(s) { observer.observe(s); });
})();
</script>
